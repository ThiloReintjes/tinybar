name: Release

# Push a tag like v0.1.0 to publish a GitHub Release with Tinybar-<version>.zip attached and
# bump the cask in ThiloReintjes/homebrew-tinybar. The app is signed with Developer ID and notarized;
# the release stops if either is missing, so an ad-hoc build never reaches Homebrew.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Different tags share one tap; never race its read/compare/write sequence.
concurrency:
  group: release-homebrew-tap
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Info.plist
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]] || { echo "Tag ${GITHUB_REF_NAME} ≠ v${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: swift test
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          printf '%s' "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          # Pinned to the team that holds the Apple Developer Program membership.
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: .* (Y7CP988PG5)"' | head -1 | tr -d '"')
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity for Y7CP988PG5 in DEVELOPER_ID_P12"; exit 1; }
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
      - name: Build, sign and notarize
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          export NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8" | base64 --decode > "$NOTARY_KEY"
          ./Scripts/build-app.sh --zip
          rm "$NOTARY_KEY"
      - name: Check Gatekeeper accepts the release
        run: |
          check="$RUNNER_TEMP/check"
          mkdir "$check" && ditto -x -k "build/Tinybar-${VERSION}.zip" "$check"
          codesign --verify --strict --deep "$check/Tinybar.app"
          xcrun stapler validate "$check/Tinybar.app"
          spctl --assess --type execute -vv "$check/Tinybar.app"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="Tinybar-${VERSION}.zip"
          if assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' 2>/dev/null); then
            if printf '%s\n' "$assets" | grep -Fxq "$asset"; then
              # Keep the published bytes stable; the cask below hashes this exact download.
              gh release download "${GITHUB_REF_NAME}" --pattern "$asset" --dir build --clobber
            else
              gh release upload "${GITHUB_REF_NAME}" "build/$asset"
            fi
          else
            gh release create "${GITHUB_REF_NAME}" "build/$asset" \
              --title "Tinybar ${VERSION}" --generate-notes
          fi
      - name: Bump the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          sha=$(shasum -a 256 "build/Tinybar-${VERSION}.zip" | cut -d' ' -f1)
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key" && chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes"
          git clone -q git@github.com:ThiloReintjes/homebrew-tinybar.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          ruby -r rubygems -e '
            current = File.read("Casks/tinybar.rb")[/^  version "([^"]+)"/, 1]
            abort "Missing cask version" unless current
            abort "Refusing to downgrade the cask" if Gem::Version.new(current) > Gem::Version.new(ENV.fetch("VERSION"))
          '
          sed -i '' -E "s/^  version \".*\"/  version \"${VERSION}\"/; s/^  sha256 \".*\"/  sha256 \"${sha}\"/" Casks/tinybar.rb
          if ! git diff --quiet -- Casks/tinybar.rb; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "Update Tinybar to ${VERSION}"
          fi
          git push -q
      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
