name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: ./Scripts/build-app.sh
